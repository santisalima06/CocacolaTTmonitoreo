<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Compras — Canal Tradicional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Supabase JS Client (v2 CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#E4002B; --red-dark:#A3001F; --red-light:#FDEAEE; --red-softest:#FFF5F6;
    --bg:#F5F3F1; --surface:#FFFFFF; --border:#E7E2DD; --border-soft:#F0ECE8;
    --text:#191614; --text-muted:#6E6660; --text-faint:#A69E97;
    --green:#177A3D; --green-bg:#E9F6EE; --green-border:#C7E8D3;
    --amber:#B15E00; --amber-bg:#FEF3DF; --amber-border:#F3D89B;
    --danger:#C1121F; --danger-bg:#FCEBEC; --danger-border:#F1C3C8;
    --radius-sm:8px; --radius:12px; --radius-lg:18px;
    --shadow-sm:0 1px 2px rgba(25,15,12,.05);
    --shadow-md:0 6px 20px rgba(25,15,12,.07);
    --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-0.01em;}
  .muted{color:var(--text-muted);}
  .faint{color:var(--text-faint);}

  .topbar{background:var(--red);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-md);position:sticky;top:0;z-index:10;}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:16px;height:16px;}
  .topbar .brand-title{font-weight:800;font-size:15px;letter-spacing:.2px;line-height:1.2;}
  .topbar .brand-sub{font-weight:500;font-size:11px;opacity:.82;letter-spacing:.6px;text-transform:uppercase;margin-top:1px;}

  main{max-width:1040px;margin:0 auto;padding:26px 20px 70px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);}

  .btn{border-radius:var(--radius-sm);font-size:13px;font-weight:600;padding:9px 15px;cursor:pointer;border:1px solid transparent;font-family:var(--sans);transition:all .15s ease;}
  .btn-primary{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(228,0,43,.25);}
  .btn-primary:hover{background:var(--red-dark);box-shadow:0 3px 10px rgba(228,0,43,.32);}
  .btn-outline{background:#fff;border:1px solid var(--border);color:var(--text);}
  .btn-outline:hover{border-color:var(--red);color:var(--red);}
  .btn-danger{background:#fff;border:1px solid var(--danger-border);color:var(--danger);}
  .btn-danger:hover{background:var(--danger-bg);}
  .btn-link{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px;padding:0;font-family:var(--sans);}
  .btn-link:hover{color:var(--red);}

  input[type=text],input[type=date],input[type=number],select{
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;font-family:var(--sans);color:var(--text);background:#fff;width:100%;
  }
  input:focus,select:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-light);}
  label.field-label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:5px;font-weight:600;letter-spacing:.1px;}
  .opt-tag{font-size:10.5px;color:var(--text-faint);font-weight:400;text-transform:none;letter-spacing:0;}

  .tabbar{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .tab-btn{position:relative;background:none;border:none;padding:12px 4px;margin-right:24px;font-size:13.5px;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;font-family:var(--sans);}
  .tab-btn.active{color:var(--red);border-bottom-color:var(--red);}
  .tab-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle;}
  .dme-alert{display:flex;gap:12px;align-items:flex-start;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;color:var(--amber);}
  .dme-alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;}
  .progress-track{height:8px;background:var(--border-soft);border-radius:5px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:5px;}

  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;}

  .counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
  .count-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;transition:all .15s ease;box-shadow:var(--shadow-sm);}
  .count-card:hover{border-color:var(--text-faint);}
  .count-card.active{border-color:var(--red);background:var(--red-softest);box-shadow:0 0 0 3px var(--red-light);}
  .count-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .count-icon svg{width:17px;height:17px;}
  .count-card .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;font-weight:600;}
  .count-card .val{font-size:22px;font-weight:800;margin-top:1px;}

  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.verde{background:var(--green);} .dot.amarillo{background:#D9970C;} .dot.rojo{background:var(--danger);}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;white-space:nowrap;}
  .badge.verde{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}
  .badge.amarillo{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
  .badge.rojo{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border);}

  /* Centro de alertas */
  .alerts-card{border-radius:var(--radius);overflow:hidden;margin-bottom:16px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .alerts-head{display:flex;align-items:center;gap:9px;padding:13px 18px;background:#fff;border-bottom:1px solid var(--border-soft);}
  .alerts-head svg{width:16px;height:16px;color:var(--amber);}
  .alerts-head .t{font-weight:700;font-size:13.5px;}
  .alerts-head .n{margin-left:auto;font-size:11.5px;color:var(--text-faint);}
  .alerts-list{max-height:260px;overflow-y:auto;background:#fff;}
  .alert-item{display:flex;align-items:center;gap:12px;padding:11px 18px;border-left:3px solid transparent;cursor:pointer;border-bottom:1px solid var(--border-soft);transition:background .12s ease;}
  .alert-item:last-child{border-bottom:none;}
  .alert-item:hover{background:var(--red-softest);}
  .alert-item.rojo{border-left-color:var(--danger);}
  .alert-item.amarillo{border-left-color:#D9970C;}
  .alert-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .alert-icon svg{width:13px;height:13px;}
  .alert-body{min-width:0;flex:1;}
  .alert-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .alert-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .alert-time{font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;text-align:right;}
  .alert-time.rojo{color:var(--danger);} .alert-time.amarillo{color:var(--amber);}
  .escal-tag{display:inline-block;margin-top:2px;font-size:10px;font-weight:700;color:var(--danger);background:var(--danger-bg);border-radius:5px;padding:1px 6px;letter-spacing:.2px;}

  /* Filtros */
  .filters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}

  /* Lista de órdenes como tarjetas */
  .order-list{display:flex;flex-direction:column;gap:9px;}
  .order-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;cursor:pointer;box-shadow:var(--shadow-sm);transition:all .13s ease;}
  .order-card:hover{border-color:var(--red);box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .order-status-bar{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0;}
  .order-status-bar.verde{background:var(--green);} .order-status-bar.amarillo{background:#D9970C;} .order-status-bar.rojo{background:var(--danger);}
  .order-main{min-width:0;flex:1;}
  .order-title{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .order-sub{font-size:12px;color:var(--text-faint);margin-top:2px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .order-stage{text-align:right;flex-shrink:0;min-width:150px;}
  .order-stage .st-label{font-size:12.5px;font-weight:700;}
  .order-stage .st-resp{font-size:11px;color:var(--text-faint);margin-top:1px;}
  .order-time{font-size:12px;font-weight:700;flex-shrink:0;min-width:150px;text-align:right;}
  .chev{color:var(--text-faint);flex-shrink:0;}

  /* Stepper de etapas */
  .stepper{display:flex;overflow-x:auto;gap:0;padding:8px 2px 4px;}
  .step-col{display:flex;flex-direction:column;align-items:center;width:114px;flex-shrink:0;}
  .step-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid;}
  .step-label{font-size:11.5px;margin-top:7px;text-align:center;line-height:1.25;}
  .step-date{font-size:10.5px;color:var(--text-faint);margin-top:2px;font-family:var(--mono);}
  .connector{width:16px;height:2px;margin-top:13px;flex-shrink:0;}

  .fields-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .field-box{display:flex;flex-direction:column;gap:4px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(25,15,12,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:420px;padding:22px;box-shadow:var(--shadow-md);}
  .modal h3{margin-bottom:15px;font-size:16px;}
  .modal .err{color:var(--danger);font-size:12.5px;margin-top:8px;}

  .hist-item{display:flex;gap:10px;font-size:12.5px;margin-bottom:7px;}
  .hist-date{font-family:var(--mono);color:var(--text-faint);flex-shrink:0;}
  .footer-note{margin-top:20px;font-size:11.5px;color:var(--text-faint);}
  .empty-msg{padding:30px 0;text-align:center;color:var(--text-faint);font-size:13px;}
  ::-placeholder{color:var(--text-faint);}
  ::-webkit-scrollbar{height:8px;width:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h10M14 12l-3-3M14 12l-3 3"/><circle cx="19" cy="12" r="2.2"/></svg></div>
  <div>
    <div class="brand-title">Canal Tradicional</div>
    <div class="brand-sub">Seguimiento de compras</div>
  </div>
  <div style="margin-left:auto;font-size:11px;font-weight:600;opacity:.75;letter-spacing:.3px;">v<span id="app-version"></span></div>
</div>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ---------------------------------------------------------------------------
// Versión de la app — súbela cada vez que se entregue un cambio nuevo
// ---------------------------------------------------------------------------
const APP_VERSION = '3.0 (Supabase Realtime)';

// ---------------------------------------------------------------------------
// Configuración e Inicialización de Supabase
// REEMPLAZA ESTOS VALORES CON TUS CREDENCIALES DE SUPABASE
// ---------------------------------------------------------------------------
const SUPABASE_URL = 'https://TU_PROYECTO.supabase.co';
const SUPABASE_KEY = 'TU_ANON_KEY_PUBLIC';

const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

// ---------------------------------------------------------------------------
// Iconos (SVG inline, sin dependencias externas)
// ---------------------------------------------------------------------------
const ICONS = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  alertTriangle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
};

// ---------------------------------------------------------------------------
// Utilidades de días hábiles
// ---------------------------------------------------------------------------
function esHabil(d){ const day = d.getDay(); return day !== 0 && day !== 6; }
function diasHabilesEntre(inicioISO, finISO){
  if(!inicioISO) return 0;
  const inicio = new Date(inicioISO+'T00:00:00');
  const fin = finISO ? new Date(finISO+'T00:00:00') : new Date(new Date().toDateString());
  if(fin <= inicio) return 0;
  let count = 0; const d = new Date(inicio);
  while(d < fin){ d.setDate(d.getDate()+1); if(esHabil(d)) count++; }
  return count;
}
function sumarDiasHabiles(dateObj, n){
  const d = new Date(dateObj); let added = 0; const dir = n>=0?1:-1; const total = Math.abs(n);
  while(added < total){ d.setDate(d.getDate()+dir); if(esHabil(d)) added++; }
  return d;
}
const hoyISO = () => new Date().toISOString().slice(0,10);
const isoDesdeHoy = (offset) => sumarDiasHabiles(new Date(), offset).toISOString().slice(0,10);
function fmt(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------------------------------------------------------------------------
// Definición de las 8 etapas
// ---------------------------------------------------------------------------
const STAGES = [
  {key:'briefing', label:'Briefing', responsable:'Canal Tradicional', sla:1, warns:[], dateField:'briefingPublicado', inputLabel:'Briefing publicado', startFrom:o=>o.creadoEn},
  {key:'comparativo', label:'Comparativo', responsable:'Abastecimiento', sla:10, warns:[5,10], dateField:'comparativoRecibido', inputLabel:'Comparativo recibido', startFrom:o=>o.fechas.briefingPublicado},
  {key:'requisicion', label:'Requisición', responsable:'Canal Tradicional', sla:1, warns:[], dateField:'requisicionEmitida', inputLabel:'Requisición emitida', startFrom:o=>o.fechas.comparativoRecibido},
  {key:'oc', label:'Orden de compra', responsable:'Abastecimiento', sla:7, warns:[2,3], dateField:'ocEmitida', inputLabel:'Orden de compra emitida', startFrom:o=>o.fechas.requisicionEmitida},
  {key:'muestra', label:'Muestra', responsable:'Proveedor', sla:4, warns:[1], dateField:'muestraRecibida', inputLabel:'Muestra recibida', startFrom:o=>o.fechas.ocEmitida},
  {key:'aprobacion', label:'Aprobación', responsable:'Canal Tradicional', sla:0, warns:[], dateField:'aprobacion', inputLabel:'Muestra aprobada', startFrom:o=>o.fechas.muestraRecibida},
  {key:'entrega', label:'Entrega', responsable:'Proveedor', sla:null, warns:'recurrente5', dateField:'entregaReal', inputLabel:'Entrega completa', startFrom:o=>o.fechas.entregaUltimoSeguimiento || o.fechas.aprobacion},
  {key:'cierre', label:'Cierre', responsable:'Canal Tradicional', sla:0, warns:[], dateField:'cierre', inputLabel:'Cierre', startFrom:o=>o.fechas.entregaReal},
];
const CAMPOS_EXTRA = [
  {key:'muestraEstimada', label:'Muestra — fecha estimada por el proveedor (opcional)'},
  {key:'entregaUltimoSeguimiento', label:'Entrega — último seguimiento con el proveedor (opcional, reinicia el contador de 5 días)'},
];
const emptyFechas = () => ({
  briefingPublicado:null, comparativoRecibido:null, requisicionEmitida:null, ocEmitida:null,
  muestraEstimada:null, muestraRecibida:null, aprobacion:null, entregaUltimoSeguimiento:null,
  entregaReal:null, cierre:null,
});

function getEstado(o){
  for(let i=0;i<STAGES.length;i++){ if(!o.fechas[STAGES[i].dateField]) return {index:i, completado:false}; }
  return {index:7, completado:true};
}

function computeStatus(o){
  const estado = getEstado(o);
  if(estado.completado) return {dias:0, semaforo:'verde', mensaje:'Completada', sub:'Todas las etapas registradas', escalado:false, index:7};
  const stage = STAGES[estado.index];
  const inicio = stage.startFrom(o);
  const dias = diasHabilesEntre(inicio, null);
  let semaforo = 'verde', escalado = false, mensaje = '', sub = stage.label;

  if(stage.warns === 'recurrente5'){
    const restante = 5 - (dias % 5 === 0 && dias>0 ? 0 : dias % 5);
    if(dias >= 20){ semaforo='rojo'; mensaje = `Vencida — ${dias} días sin seguimiento`; }
    else if(dias > 0 && dias % 5 === 0){ semaforo='amarillo'; mensaje = `Toca dar seguimiento hoy`; }
    else { mensaje = `Próximo seguimiento en ${restante} día(s) hábil(es)`; }
    sub = `${dias} día(s) hábil(es) en entrega`;
  } else if(stage.sla === 0){
    if(dias >= 2){ semaforo='rojo'; mensaje = `Vencida — ${dias} días sin registrar`; }
    else if(dias >= 1){ semaforo='amarillo'; mensaje = `Pendiente de registrar hoy`; }
    else { mensaje = `Al día`; }
  } else if(typeof stage.sla === 'number'){
    const restante = stage.sla - dias;
    if(restante < 0){ semaforo='rojo'; escalado = stage.key==='comparativo' || stage.key==='oc'; mensaje = `Vencida hace ${-restante} día(s) hábil(es)`; }
    else if(restante === 0){ semaforo='amarillo'; mensaje = `Vence hoy`; }
    else if(stage.warns.some(w=>dias>=w)){ semaforo='amarillo'; mensaje = `Vence en ${restante} día(s) hábil(es)`; }
    else { mensaje = `Vence en ${restante} día(s) hábil(es)`; }
  }
  return {dias, semaforo, mensaje, sub, escalado, index: estado.index};
}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function mesLabel(yyyyMM){
  const [y,m] = yyyyMM.split('-');
  const nombre = MESES[parseInt(m,10)-1];
  return nombre.charAt(0).toUpperCase()+nombre.slice(1)+' '+y;
}
function fmtMoney(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-VE', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function burbujaDME(ejecutado, meta){
  const sinMeta = !(meta>0);
  const pct = sinMeta ? 0 : (ejecutado/meta)*100;
  const pctRedondeado = Math.round(pct);
  const color = 'var(--red)';
  const bg = 'var(--red-softest)';
  const rad = 46, stroke = 11, circ = 2*Math.PI*rad, dash = circ*(Math.min(100,pct)/100);
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
    <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:120px;">
      <div style="position:relative;width:120px;height:120px;">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="${rad}" fill="${bg}" stroke="var(--border-soft)" stroke-width="${stroke}"/>
          <circle cx="60" cy="60" r="${rad}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
            stroke-dasharray="${dash} ${circ}" transform="rotate(-90 60 60)"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <div style="font-size:28px;font-weight:800;color:${sinMeta?'var(--text-faint)':color};line-height:1;">${sinMeta?'—':pctRedondeado+'%'}</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-top:8px;">DME ejecutado</div>

           <div class="muted" style="font-size:12px;margin-top:4px;">${fmtMoney(ejecutado)} de ${fmtMoney(meta)}</div>
           ${pct>=100 ? `<div style="font-size:12px;color:var(--danger);font-weight:600;margin-top:4px;">Sobre-ejecutado por ${fmtMoney(ejecutado-meta)}</div>` : ''}`}
    </div>
  </div>`;
}

function montoOrden(o){
  const costo = Number(o.costoUnitario)||0;
  const cant = Number(o.cantidad)||0;
  return costo * cant;
}
function estadoGasto(o){
  if(o.fechas.entregaReal) return 'real';
  if(o.fechas.requisicionEmitida) return 'comprometido';
  return null;
}
function resumenDME(mes){
  let compProd=0, compServ=0, realProd=0, realServ=0;
  state.orders.forEach(o=>{
    if((o.mesInicio||'') !== mes) return;
    const monto = montoOrden(o);
    if(monto<=0) return;
    const eg = estadoGasto(o);
    if(eg==='comprometido'){ if(o.tipoGasto==='servicio') compServ+=monto; else compProd+=monto; }
    else if(eg==='real'){ if(o.tipoGasto==='servicio') realServ+=monto; else realProd+=monto; }
  });
  return { compProd, compServ, compTotal: compProd+compServ, realProd, realServ, realTotal: realProd+realServ };
}

let state = {
  orders: [], dmeMetas: {}, tab:'ordenes', dmeMes: hoyISO().slice(0,7),
  view:'lista', selectedId:null,
  filtroSem:'todos', filtroEstado:'todos',
  fNombre:'', fProveedor:'todos', fRequisicion:'', fOC:'', fMes:'todos',
  modal:null, modalErr:'', confirmDelete:false,
  cargando:true, syncError:'',
};

function migrarOrdenes(){
  state.orders.forEach(o=>{
    if(!o.fechas) o.fechas = emptyFechas();
    if(!o.historial) o.historial = [];
    if(o.costoUnitario===undefined) o.costoUnitario = null;
    if(o.cantidad===undefined) o.cantidad = 1;
    if(o.tipoGasto===undefined) o.tipoGasto = 'producto';
    if(!o.mesInicio) o.mesInicio = (o.creadoEn||hoyISO()).slice(0,7);
  });
}

// Función principal para leer de Supabase
async function cargar(){
  state.cargando = true;
  if(!supabaseClient){
    state.syncError = 'Por favor configura SUPABASE_URL y SUPABASE_KEY en el código.';
    state.cargando = false;
    render();
    return;
  }
  
  try {
    // 1. Obtener órdenes de la tabla ordenes_compra
    const { data: ordenesData, error: errOrdenes } = await supabaseClient
      .from('ordenes_compra')
      .select('*');
    if (errOrdenes) throw errOrdenes;

    // 2. Obtener metas de la tabla dme_metas
    const { data: metasData, error: errMetas } = await supabaseClient
      .from('dme_metas')
      .select('*');
    if (errMetas) throw errMetas;

    state.orders = ordenesData || [];
    
    // Convertir array de metas a un mapa { [mes]: {productos, servicios} }
    const metasMap = {};
    if (metasData) {
      metasData.forEach(m => {
        metasMap[m.mes] = { productos: m.productos, servicios: m.servicios };
      });
    }
    state.dmeMetas = metasMap;
    state.syncError = '';
    migrarOrdenes();
  } catch(e) {
    console.error('Error al cargar datos desde Supabase:', e);
    state.syncError = 'Error de sincronización con Supabase: ' + e.message;
  } finally {
    state.cargando = false;
    render();
  }
}

// Función para guardar (upsert) datos hacia Supabase
async function guardar(ordenParaGuardar = null, metaParaGuardar = null){
  if(!supabaseClient) return;

  try {
    if(ordenParaGuardar) {
      const { error } = await supabaseClient
        .from('ordenes_compra')
        .upsert(ordenParaGuardar);
      if(error) throw error;
    }
    
    if(metaParaGuardar) {
      const { mes, ...metas } = metaParaGuardar;
      const { error } = await supabaseClient
        .from('dme_metas')
        .upsert({ mes, productos: metas.productos, servicios: metas.servicios });
      if(error) throw error;
    }
  } catch(e) {
    console.error('Error al guardar en Supabase:', e);
    state.syncError = 'Error al guardar los cambios: ' + e.message;
    render();
  }
}

// Eliminar una orden de la base de datos
async function eliminarOrden(id) {
  if(!supabaseClient) return;
  try {
    const { error } = await supabaseClient
      .from('ordenes_compra')
      .delete()
      .eq('id', id);
    if (error) throw error;
  } catch(e) {
    console.error('Error al borrar en Supabase:', e);
  }
}

// Suscripción Realtime activa de Supabase
function iniciarSuscripcionRealtime() {
  if (!supabaseClient) return;

  supabaseClient
    .channel('realtime_ordenes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ordenes_compra' }, payload => {
      if (payload.eventType === 'INSERT') {
        const existe = state.orders.some(o => o.id === payload.new.id);
        if (!existe) state.orders.push(payload.new);
      } else if (payload.eventType === 'UPDATE') {
        const idx = state.orders.findIndex(o => o.id === payload.new.id);
        if (idx !== -1) state.orders[idx] = payload.new;
      } else if (payload.eventType === 'DELETE') {
        state.orders = state.orders.filter(o => o.id !== payload.old.id);
      }
      migrarOrdenes();
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'dme_metas' }, payload => {
      if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
        state.dmeMetas[payload.new.mes] = { productos: payload.new.productos, servicios: payload.new.servicios };
      }
      render();
    })
    .subscribe();
}

  html += `<div class="tabbar">

    <button class="tab-btn ${state.tab==='dme'?'active':''}" onclick="setTab('dme')">Presupuesto DME</button>

  const o = state.orders.find(item => item.id === id);

  o[field] = value;
  await guardar(o);

async function actualizarFechaEtapa(id, dateField, value){
  const o = state.orders.find(item => item.id === id);
  if(!o) return;
  o.fechas[dateField] = value || null;

  o.historial.push({
    fecha: hoyISO(),
    mensaje: `Se actualizó la fecha (${dateField}) a: ${value || 'Vacío'}`

  await guardar(o);
  render();
}

}

async function guardarMetaDME(mes, campo, valor){
  if(!state.dmeMetas[mes]) state.dmeMetas[mes] = { productos: 0, servicios: 0 };
  state.dmeMetas[mes][campo] = valor;
  
  const payload = {
    mes,
    productos: state.dmeMetas[mes].productos,
    servicios: state.dmeMetas[mes].servicios
  };
  await guardar(null, payload);
  render();
}

// ---------------------------------------------------------------------------
// Modales
// ---------------------------------------------------------------------------
function renderModal(){
  if(!state.modal) return '';
  let html = `<div class="modal-overlay">
    <div class="modal">
      <h3>Crear Nueva Orden</h3>
      
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div>
          <label class="field-label">Producto / Descripción *</label>
          <input type="text" id="m-prod" value="${esc(state.modal.producto)}" oninput="state.modal.producto=this.value">
        </div>
        <div>
          <label class="field-label">Proveedor *</label>
          <input type="text" id="m-prov" value="${esc(state.modal.proveedor)}" oninput="state.modal.proveedor=this.value">
        </div>
        <div class="fields-grid" style="grid-template-columns:1fr 1fr;">
          <div>
            <label class="field-label">Costo Unit. ($)</label>
            <input type="number" step="0.01" value="${state.modal.costoUnitario}" oninput="state.modal.costoUnitario=this.value">
          </div>
          <div>
            <label class="field-label">Cantidad</label>
            <input type="number" value="${state.modal.cantidad}" oninput="state.modal.cantidad=this.value">
          </div>
        </div>
        <div>
          <label class="field-label">Tipo de Gasto</label>
          <select onchange="state.modal.tipoGasto=this.value">
            <option value="producto" ${state.modal.tipoGasto==='producto'?'selected':''}>Producto</option>
            <option value="servicio" ${state.modal.tipoGasto==='servicio'?'selected':''}>Servicio</option>
          </select>
        </div>
      </div>

      ${state.modalErr ? `<div class="err">${esc(state.modalErr)}</div>` : ''}

      <div style="margin-top:18px;display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-outline" onclick="state.modal=null;render();">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarNuevaOrden()">Crear Orden</button>
      </div>
    </div>
  </div>`;
  return html;
}

async function guardarNuevaOrden(){
  if(!state.modal.producto.trim() || !state.modal.proveedor.trim()){
    state.modalErr = 'Debes ingresar el producto y el proveedor.';
    render();
    return;
  }

  const id = 'OC-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000);
  const nueva = {
    id,
    producto: state.modal.producto.trim(),
    proveedor: state.modal.proveedor.trim(),
    numeroRequisicion: null,
    numeroOC: null,
    costoUnitario: parseFloat(state.modal.costoUnitario) || null,
    cantidad: parseInt(state.modal.cantidad, 10) || 1,
    tipoGasto: state.modal.tipoGasto || 'producto',
    creadoEn: hoyISO(),
    mesInicio: hoyISO().slice(0,7),
    fechas: emptyFechas(),
    historial: [{ fecha: hoyISO(), mensaje: 'Orden creada' }]
  };

  state.orders.push(nueva);
  await guardar(nueva);
  state.modal = null;
  state.selectedId = id;
  state.view = 'detalle';
  render();
}
</script>

</html>
